<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>工程検査管理</title>
  <script src="js/jquery-2.1.3.min.js"></script>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 簡易的なレイアウト調整 */
    .input-area input, .input-area select { display: block; margin-bottom: 10px; width: 100%; padding: 8px; }
    #list li { border-bottom: 1px solid #ccc; padding: 10px 0; list-style: none; }
    
    /* 「遅れ」用の赤色太字スタイル */
    .delay-text { color: #ff0000; font-weight: bold; }
    .normal-text { font-weight: bold; }

    /* バッジのスタイル */
    .floor-badge { background: #005bac; color: #fff; padding: 2px 6px; font-size: 12px; border-radius: 3px; margin-right: 5px; }
    .area-badge { background: #666; color: #fff; padding: 2px 6px; font-size: 12px; border-radius: 3px; margin-right: 5px; }

    /* フロアと工区を横並びに配置するためのCSS */
    .inline-group {
      display: flex;       
      gap: 10px;           
      margin-bottom: 10px;
    }
    .inline-item {
      flex: 1;             
    }
    .inline-item label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>工程管理検査記録</h1>

  <main>
    <div class="input-area">
      
      <!-- フロアと工区を横並びに配置 -->
      <div class="inline-group">
        <div class="inline-item">
          <label>対象フロア：</label>
          <select id="floor">
            <option value="1階">1階</option>
            <option value="2階">2階</option>
            <option value="3階">3階</option>
            <option value="4階">4階</option>
            <option value="5階">5階</option>
          </select>
        </div>
        
        <div class="inline-item">
          <label>対象工区：</label>
          <select id="area">
            <option value="A工区">A工区</option>
            <option value="B工区">B工区</option>
            <option value="C工区">C工区</option>
          </select>
        </div>
      </div>

      <label>検査項目：</label>
      <input id="title" type="text" placeholder="例：衛生・受水槽満水試験">
      
      <label>検査予定日：</label>
      <input id="plan_date" type="date">
      
      <label>検査実施日：</label>
      <input id="actual_date" type="date">
    </div>

    <div class="button-area">
      <button id="save">検査結果を記録</button>
      <button id="clear">全データ削除</button>
    </div>
  </main>

  <ul id="list">
    <!-- ここに追加データが挿入される -->
  </ul>

  <footer>
    ⚪︎⚪︎建設プロジェクト
  </footer>

  <script>
    // 画面描画のための共通関数
    function showList() {
      $("#list").empty();

      for (let i = 0; i < localStorage.length; i++) {
        const rawKey = localStorage.key(i);       
        const value = localStorage.getItem(rawKey); 
        
        const keyArray = rawKey.split("_");
        const floor = keyArray[0];
        const area = keyArray[1];
        const title = keyArray[2];

        const dataArray = value.split(",");
        const plan = dataArray[0];
        const actual = dataArray[1];
        const delay = dataArray[2];

        let statusClass = "normal-text";
        if (delay.includes("遅れ")) {
          statusClass = "delay-text";
        }

        const html = `
          <li>
            <h3>
              <span class="floor-badge">${floor}</span>
              <span class="area-badge">${area}</span>
              <strong>${title}</strong>
            </h3>
            <p>予定日: ${plan} ｜ 実施日: ${actual}</p>
            <p>状況: <strong class="${statusClass}">${delay}</strong></p>
          </li>
        `;
        $("#list").append(html);
      }
    }

    // 3. ページ読み込み時の処理
    showList();


    // 1. Save クリックイベント
    $("#save").on("click", function () {
      const floor = $("#floor").val();          
      const area = $("#area").val();            
      const title = $("#title").val();          
      const planDate = $("#plan_date").val();   
      const actualDate = $("#actual_date").val();

      if (!title || !planDate || !actualDate) {
        alert("検査項目、予定日、実施日をすべて入力してください");
        return;
      }

      // 遅延日数の計算
      const d1 = new Date(planDate);   
      const d2 = new Date(actualDate); 
      const diffTime = d2 - d1; 
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

      let delayText = "";
      if (diffDays > 0) {
        delayText = `${diffDays}日の遅れ`;
      } else if (diffDays < 0) {
        delayText = `${Math.abs(diffDays)}日の前倒し`;
      } else {
        delayText = "予定通り";
      }

      // ローカルストレージに保存する「Key」を「階数_工区_項目名」の形にする
      const key = `${floor}_${area}_${title}`;
      const value = `${planDate},${actualDate},${delayText}`;

      // ローカルストレージに保存
      localStorage.setItem(key, value);
      showList();

      // GAS経由でスプレッドシートへ自動送信
      const gasUrl = "https://script.google.com/macros/s/AKfycbxXYQ0It_WIznoINa9UJixr1EYliFgzi4cHqGkIMp77FJzjoiBPPgX550pkZ3-jY-mElg/exec";

      const sendData = {
        floor: floor,
        area: area,
        title: title,
        planDate: planDate,
        actualDate: actualDate,
        delayText: delayText
      };

      // jQueryのAjax機能を使って通信を行う
      $.ajax({
        url: gasUrl,
        type: "POST",
        contentType: "text/plain", 
        data: JSON.stringify(sendData),
        success: function (response) {
          console.log("Googleスプレッドシートに同期しました！");
        },
        error: function (error) {
          console.error("スプレッドシートへの同期に失敗しました", error);
        }
      });

      // 入力欄をクリア
      $("#title").val("");
      $("#plan_date").val("");
      $("#actual_date").val("");
    });


    // 2. clear クリックイベント
    $("#clear").on("click", function () {
      if (confirm("本当に全ての検査データを消去しますか？")) {
        localStorage.clear();
        $("#list").empty();
      }
    });

  </script>
</body>

</html>
